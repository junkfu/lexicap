<!doctype html>
<meta charset="utf-8" />
<title>Lexicap — 宣傳圖塊</title>
<!--
  Chrome Web Store 宣傳圖塊的來源。用 scripts/build-promo-tile.sh 轉成 PNG。

  為什麼是 HTML 而不是圖檔：文案改一個字不必重畫，而且 headless Chrome
  以 2 倍解析度算圖再縮，文字邊緣比直接畫在 440×280 上乾淨得多。

  圖示是用 CSS 重畫的，不是貼 public/icon/128.png ——
  128px 的來源放大到 2 倍畫布會糊，CSS 圖形則是向量等級的銳利度。
  幾何比例對齊 scripts/build-icons.py，改圖示時兩邊要一起改。
-->
<style>
  /* 畫布尺寸由 --w / --h 決定，build-promo-tile.sh 會覆寫這兩個值，
     440×280 的小圖塊與 1400×560 的大圖塊共用同一份版面 */
  :root { --w: 440px; --h: 280px; --scale: 1; }

  * { box-sizing: border-box; margin: 0; }
  body { background: #000; }

  .tile {
    width: var(--w);
    height: var(--h);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: calc(22px * var(--scale));
    padding: calc(28px * var(--scale));
    /* 商店可能替圖塊裁圓角，內容全部留在 padding 內 */
    background:
      radial-gradient(120% 90% at 18% 42%, rgba(247, 148, 29, .13), transparent 62%),
      linear-gradient(150deg, #1c1c28 0%, #101018 55%, #0b0b11 100%);
    font-family: "PingFang TC", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }

  /* ── 圖示：對齊 scripts/build-icons.py 的幾何 ── */
  .icon {
    position: relative;
    flex: none;
    width: calc(108px * var(--scale));
    height: calc(108px * var(--scale));
    border-radius: 24%;
    background: linear-gradient(180deg, #20202e, #0d0d14);
    box-shadow: 0 calc(10px * var(--scale)) calc(28px * var(--scale)) rgba(0, 0, 0, .55);
  }
  .icon i {
    position: absolute;
    display: block;
    border-radius: 999px;
    background: #eef0f4;
  }
  /* 被「拎起來」的那個詞 */
  .word {
    left: 29.7%; right: 28.9%; top: 25%; height: 19.5%;
    background: linear-gradient(180deg, #ffba2e, #f7941d) !important;
    box-shadow: 0 calc(4px * var(--scale)) calc(9px * var(--scale)) rgba(0, 0, 0, .5);
  }
  .bar1 { left: 17.2%; right: 17.2%; top: 59.6%; height: 9.7%; }
  .bar2 { left: 33.6%; right: 33.6%; top: 75.2%; height: 10.7%; }

  /* ── 文字 ── */
  .copy { min-width: 0; }
  .name {
    font-size: calc(38px * var(--scale));
    font-weight: 700;
    letter-spacing: calc(-0.6px * var(--scale));
    color: #f4f4f7;
    line-height: 1.05;
  }
  .rule {
    width: calc(30px * var(--scale));
    height: calc(3px * var(--scale));
    margin: calc(11px * var(--scale)) 0 calc(12px * var(--scale));
    border-radius: 999px;
    background: linear-gradient(90deg, #ffba2e, #f7941d);
  }
  .tagline {
    font-size: calc(15.5px * var(--scale));
    line-height: 1.45;
    color: #a2a2ae;
    white-space: nowrap;
  }
  .meta {
    margin-top: calc(11px * var(--scale));
    font-size: calc(12.5px * var(--scale));
    letter-spacing: calc(.3px * var(--scale));
    color: #7e7e8b;
    white-space: nowrap;
  }
</style>

<div class="tile">
  <div class="icon">
    <i class="word"></i>
    <i class="bar1"></i>
    <i class="bar2"></i>
  </div>
  <div class="copy">
    <div class="name">Lexicap</div>
    <div class="rule"></div>
    <div class="tagline">一本會自動長大的看片筆記本</div>
    <div class="meta">離線 · 免費 · 零設定</div>
  </div>
</div>
